stages:
  data_loading:
    cmd: python src/bearing_fault_detection/data.py
    deps:
      - src/bearing_fault_detection/data.py
      - logging_config.py
      - pyproject.toml
      - requirements.txt
      - ${paths.recording_registry}
      - ${paths.raw_data}
    params:
      - data
      - paths.recording_registry
      - paths.raw_data
      - paths.development_registry
    outs:
      - ${paths.development_registry}

  preprocessing:
    cmd: python src/bearing_fault_detection/preprocessing.py
    deps:
      - src/bearing_fault_detection/preprocessing.py
      - src/bearing_fault_detection/data.py
      - logging_config.py
      - pyproject.toml
      - requirements.txt
      - ${paths.development_registry}
      - ${paths.raw_data}
    params:
      - data.channel
      - preprocessing
      - paths.development_registry
      - paths.raw_data
      - paths.windows
      - paths.window_registry
    outs:
      - ${paths.windows}
      - ${paths.window_registry}
